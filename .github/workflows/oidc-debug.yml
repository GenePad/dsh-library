# Temporary diagnostic: verify whether the OIDC request credentials
# (ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN) reach jobs that declare
# id-token: write in this repository. Remove after the npm trusted
# publishing path is confirmed.
name: OIDC debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OIDC request credentials
        env:
          URL: ${{ vars.ACTIONS_ID_TOKEN_REQUEST_URL || '' }}
        run: |
          if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL is present"
            RESP="$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
            TOKEN="$(node -e "const j=JSON.parse(process.argv[1]);console.log(j.value||'')" "$RESP")"
            if [[ -z "$TOKEN" ]]; then
              echo "OIDC token request FAILED:"; echo "$RESP"
            else
              node -e '
                const claims = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url").toString());
                console.log(JSON.stringify({
                  sub: claims.sub,
                  repository: claims.repository,
                  ref: claims.ref,
                  workflow: claims.workflow,
                  job_workflow_ref: claims.job_workflow_ref,
                  aud: claims.aud
                }, null, 1));
              ' "$TOKEN"
            fi
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_URL MISSING — id-token: write was NOT granted to this job"
            echo "Effective GITHUB_TOKEN permissions are visible in the Set up job group above."
          fi
